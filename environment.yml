name: pise_env
channels:
  - conda-forge
  - defaults
dependencies:
  # Exact versions resolved from the environment used for the published analyses.
  - python=3.12.12
  - pip=25.3
  # Numba requires NumPy 2.3 or lower until a newer numba supports NumPy 2.4.
  - numpy=2.2.6
  - pandas=2.2.3
  - matplotlib=3.10.8
  - scipy=1.14.1
  - scikit-learn=1.8.0
  - seaborn=0.13.2
  - jupyter=1.1.1
  - ipykernel=6.29.5
  - ipython=9.9.0
  - numba=0.63.1
  - pytest=9.0.2
  # pymer4/rpy2: use this R; avoid HPC `module load r/...` (Singularity R breaks host rpy2).
  - r-base=4.4.3
  - r-lme4=1.1_37
  - r-lmertest=3.2_1
  - r-tibble=3.3.1
  - r-broom=1.0.13
